name: Publish TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish to TestPyPI
    runs-on: ubuntu-22.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/projmem/

    steps:
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            if git fetch --no-tags --depth=1 origin "$GITHUB_SHA"; then
              git checkout --force FETCH_HEAD
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --all-groups --no-editable

      - name: CLI smoke
        run: |
          uv run pmem --help
          uv run pmem import --help

      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest --cov=pmem --cov-report=term-missing

      - name: Build package
        run: uv build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
