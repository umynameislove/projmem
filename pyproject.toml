[build-system]
# setuptools is intentionally boring here: it handles the src-layout package
# cleanly while the distribution name (`projmem`) differs from the import
# package (`pmem`).
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name on PyPI/TestPyPI. The installed command remains `pmem`.
name = "projmem"
version = "0.4.0a1"
description = "Local-first long-horizon project memory for AI research"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Quoc Bao Tran" },
]
keywords = [
  "ai",
  "cli",
  "experiment-tracking",
  "local-first",
  "research-memory",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115,<1",
  "networkx>=3.2,<4",
  "pydantic>=2.7",
  "rich>=13.7",
  "typer>=0.12",
  "uvicorn>=0.30,<1",
]

[project.urls]
Repository = "https://github.com/umynameislove/projmem"
Issues = "https://github.com/umynameislove/projmem/issues"

[project.scripts]
# User-facing CLI command. This deliberately differs from the distribution
# name because `pmem` is already taken on PyPI but remains the intended CLI UX.
pmem = "pmem.cli.app:app"

[tool.setuptools.packages.find]
# The distribution is named `projmem`, while the import package is `pmem`.
# Package discovery must therefore search under `src` explicitly.
where = ["src"]

[tool.setuptools.package-data]
# Keep the package marked as typed for downstream users and Pyright.
pmem = ["py.typed"]

[dependency-groups]
# Tooling group. CI and local development should use:
#   uv sync --all-groups
dev = [
  "coverage[toml]>=7.6",
  "httpx2>=2.2.0",
  "pre-commit>=3.8",
  "pyright>=1.1.390",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]

[tool.ruff]
# Ruff is the single source for linting and formatting. Do not add Black.
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle/pyflakes, I: imports, UP: modern Python, B: bugbear.
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
# Type-check against the lowest supported runtime to catch accidental 3.11+
# APIs while the package still declares Python 3.10 support.
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src", "tests"]
exclude = [
  ".venv",
  "build",
  "dist",
]

[tool.pytest.ini_options]
# Keep test discovery explicit. Unit/integration split is intentional.
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "--strict-config",
  "--strict-markers",
]

[tool.coverage.run]
branch = true
source = ["pmem"]
# `python -m pmem` is a tiny wrapper around the Typer app. CLI behavior is
# covered through Typer's runner, so the wrapper is omitted from the gate.
omit = ["src/pmem/__main__.py"]

[tool.coverage.report]
# Keep the local quality bar high so database/security work stays protected.
fail_under = 95
show_missing = true
skip_covered = true
